name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [prepare-v020, publish-v020]
      prepared_run_id:
        type: string
        default: ""
      approved_wheel_sha256:
        type: string
        default: ""
      approved_sdist_sha256:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: tag must equal v + project.version
        run: |
          VERSION=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
      - run: uv lock --check
      - run: uv build --no-sources --no-create-gitignore --verbose
      - name: Record package identity and installation constraints
        run: uv run --no-project --python 3.12 python .github/workflows/verify_install.py prepare
      - name: Check built distributions before publication
        run: uv run --no-project --python 3.12 python .github/workflows/verify_install.py verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
          digest-mismatch: error
      # trusted publishing: OIDC token exchange, no stored PyPI token
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    if: github.event_name == 'push'
    needs: [build, publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
          digest-mismatch: error
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*

  recovery-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-v020'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Verify original artifacts and independent installations
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py prepare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: recovery-v020
          path: recovery-v020/
          if-no-files-found: error

  recovery-admit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Admit approved preparation and public file state
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py admit

  recovery-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    needs: recovery-admit
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Recheck approvals and stage only missing PyPI files
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py preflight
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        if: steps.preflight.outputs.upload_needed == 'true'
        with:
          packages-dir: recovery-upload/

  recovery-github:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    needs: recovery-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Verify PyPI and complete original GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py github
