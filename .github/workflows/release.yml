name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [prepare-v020, publish-v020]
      prepared_run_id:
        type: string
        default: ""
      approved_wheel_sha256:
        type: string
        default: ""
      approved_sdist_sha256:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  distribution-admit:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BREWDOC_RELEASE_TAG: ${{ github.ref_name }}
      BREWDOC_SOURCE_SHA: ${{ github.sha }}
      BREWDOC_PACKAGE_CHECKOUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - name: Admit and download one exact-source successful main CI producer
        run: uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py reuse-ci --checkout "$BREWDOC_PACKAGE_CHECKOUT" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA" --output "${{ runner.temp }}/producer"
      - name: Generate staged instructions from unchanged admitted bytes
        run: uv run --no-project --python 3.12.14 python .github/workflows/release_guide.py render --checkout "$BREWDOC_PACKAGE_CHECKOUT" --phase staged --native-manifest "${{ runner.temp }}/producer/ci-native-assets/binaries.json" --npm-manifest "${{ runner.temp }}/producer/ci-npm-release/npm-manifest.json" --output "${{ runner.temp }}/staged-body.md"
      - name: Seal the release inventory and producer provenance
        id: identity
        run: uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py prepare --checkout "$BREWDOC_PACKAGE_CHECKOUT" --bundle "${{ runner.temp }}/producer/ci-dist" --native "${{ runner.temp }}/producer/ci-native-assets" --npm "${{ runner.temp }}/producer/ci-npm-release" --producer "${{ runner.temp }}/producer/producer.json" --body "${{ runner.temp }}/staged-body.md" --output "${{ runner.temp }}/release-assets" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/producer/ci-dist/dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/producer/ci-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-npm
          path: ${{ runner.temp }}/producer/ci-npm-release/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: distribution-admit
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
          digest-mismatch: error
      # trusted publishing: OIDC token exchange, no stored PyPI token
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  npm-publish:
    if: "!cancelled() && github.event_name == 'push' && needs.distribution-admit.result == 'success' && needs.pypi-consumer.result == 'success'"
    needs: [distribution-admit, pypi-consumer]
    runs-on: ubuntu-22.04
    # Issue #53: six sequential 20min visibility budgets plus 15min setup/check reserve.
    timeout-minutes: 135
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/npm-downloads/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node24.21.0-npm12.2.0-${{ hashFiles('uv.lock', 'npm/**', '.github/workflows/build_npm.py') }}
      - name: Install pinned npm beside the selected Node runtime
        shell: bash
        run: |
          BREWDOC_NPM_PREFIX=$(node -p 'const path = require("node:path"); path.resolve(path.dirname(process.execPath), process.platform === "win32" ? "." : "..")')
          npm install --global --prefix "$BREWDOC_NPM_PREFIX" npm@12.2.0 --userconfig /dev/null
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-downloads
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-npm
          path: ${{ runner.temp }}/release-npm
          digest-mismatch: error
      - name: Publish matching platform packages before the main package
        id: npm_publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BREWDOC_NPM_DIAGNOSTIC_DIR: ${{ runner.temp }}/npm-diagnostics
        run: uv run --no-project --python 3.12.14 python .github/workflows/build_npm.py publish --input "${{ runner.temp }}/release-npm"
      - name: Preserve encrypted publication diagnostics after a failed publish
        if: failure() && steps.npm_publish.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-publish-diagnostic
          overwrite: true
          path: ${{ runner.temp }}/npm-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 1
      - name: Verify all three public npm package bytes and integrity values
        run: uv run --no-project --python 3.12.14 python .github/workflows/build_npm.py check-public --input "${{ runner.temp }}/release-npm" --output "${{ runner.temp }}/npm-public-registry.json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-public-registry
          path: ${{ runner.temp }}/npm-public-registry.json
          if-no-files-found: error

  github-release:
    if: "!cancelled() && github.event_name == 'push' && needs.distribution-admit.result == 'success' && needs.npm-publish.result == 'success' && needs.pypi-consumer.result == 'success'"
    needs: [npm-publish, distribution-admit, pypi-consumer]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - name: Complete and admit the draft before making it public
        env:
          GH_TOKEN: ${{ github.token }}
          BREWDOC_RELEASE_TAG: ${{ needs.distribution-admit.outputs.tag }}
          BREWDOC_SOURCE_SHA: ${{ needs.distribution-admit.outputs.source_sha }}
        run: |
          uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py stage-publish --input "${{ runner.temp }}/release-assets" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA"
          uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py verify-public --input "${{ runner.temp }}/release-assets" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA"

  pypi-consumer:
    if: "!cancelled() && github.event_name == 'push' && needs.distribution-admit.result == 'success' && needs.publish.result == 'success'"
    needs: [publish, distribution-admit]
    runs-on: ubuntu-22.04
    # Issue #53: two 10min installs plus 5min for setup, venvs and unchanged consumer checks.
    timeout-minutes: 25
    env:
      BREWDOC_VERSION: ${{ needs.distribution-admit.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - name: Smoke normal public PyPI wheel and forced sdist consumers
        run: |
          for route in wheel sdist; do
            prefix="${{ runner.temp }}/pypi-$route"
            uv venv --python 3.12.14 "$prefix"
            uv run --no-project --python 3.12.14 python "$GITHUB_WORKSPACE/.github/workflows/pypi_consumer.py" --python "$prefix/bin/python" --route "$route" --version "$BREWDOC_VERSION"
            cd "${{ runner.temp }}"
            "$prefix/bin/python" -c 'import brewdoc,importlib.metadata,os; version=os.environ["BREWDOC_VERSION"]; assert brewdoc.__version__==importlib.metadata.version("brewdoc")==version'
            "$prefix/bin/brewdoc" --self-check
          done

  public-consumer:
    if: "!cancelled() && github.event_name == 'push' && needs.github-release.result == 'success' && needs.pypi-consumer.result == 'success' && needs.distribution-admit.result == 'success'"
    needs: [github-release, pypi-consumer, distribution-admit]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            archive: tar.gz
          - target: macos-arm64
            os: macos-15
            archive: tar.gz
          - target: windows-x64
            os: windows-2025
            archive: zip
    env:
      GH_TOKEN: ${{ github.token }}
      BREWDOC_RELEASE_TAG: ${{ needs.distribution-admit.outputs.tag }}
      BREWDOC_SOURCE_SHA: ${{ needs.distribution-admit.outputs.source_sha }}
      BREWDOC_PACKAGE_CHECKOUT: ${{ github.workspace }}
      BREWDOC_ARCHIVE: brewdoc-${{ needs.distribution-admit.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - uses: actions/setup-node@v7.1.0
        if: matrix.target != 'windows-x64'
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/cache@v6.1.0
        if: matrix.target != 'windows-x64'
        with:
          path: ${{ runner.temp }}/npm-downloads/_cacache
          key: ${{ runner.os }}-${{ runner.arch }}-node24.21.0-npm12.2.0-${{ hashFiles('uv.lock', 'npm/**', '.github/workflows/build_npm.py') }}
      - name: Install pinned npm beside the selected Node runtime
        if: matrix.target != 'windows-x64'
        shell: bash
        run: |
          BREWDOC_NPM_PREFIX=$(node -p 'const path = require("node:path"); path.resolve(path.dirname(process.execPath), process.platform === "win32" ? "." : "..")')
          npm install --global --prefix "$BREWDOC_NPM_PREFIX" npm@12.2.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-downloads
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-package
          path: ${{ runner.temp }}/release-package
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        if: matrix.target != 'windows-x64'
        with:
          name: release-npm
          path: ${{ runner.temp }}/release-npm
          digest-mismatch: error
      - name: Read the unchanged target manifest from the admitted aggregate
        env:
          BREWDOC_TARGET: ${{ matrix.target }}
          BREWDOC_ASSETS: ${{ runner.temp }}/release-assets
          BREWDOC_EVIDENCE: ${{ runner.temp }}/public-evidence
        run: |
          mkdir -p "${{ runner.temp }}/public-evidence/$BREWDOC_TARGET"
          uv run --no-project --python 3.12.14 python -c 'import json,os,pathlib; source=pathlib.Path(os.environ["BREWDOC_ASSETS"]); target=os.environ["BREWDOC_TARGET"]; output=pathlib.Path(os.environ["BREWDOC_EVIDENCE"])/target/"manifest.json"; output.write_text(json.dumps(json.loads((source/"binaries.json").read_text())["targets"][target])+"\n",encoding="utf-8")'
      - name: Download and verify the actual public native archive
        run: |
          mkdir -p "${{ runner.temp }}/public-downloads/${{ matrix.target }}"
          uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py download-target --input "${{ runner.temp }}/release-assets" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA" --target "${{ matrix.target }}" --output "${{ runner.temp }}/public-downloads/${{ matrix.target }}/$BREWDOC_ARCHIVE"
          uv run --no-project --python 3.12.14 python .github/workflows/build_standalone.py verify --checkout "$BREWDOC_PACKAGE_CHECKOUT" --bundle "${{ runner.temp }}/release-package" --output "${{ runner.temp }}/public-evidence/${{ matrix.target }}" --target "${{ matrix.target }}" --archive "${{ runner.temp }}/public-downloads/${{ matrix.target }}/$BREWDOC_ARCHIVE" --smoke
          cp "${{ runner.temp }}/public-downloads/${{ matrix.target }}/$BREWDOC_ARCHIVE.download.json" "${{ runner.temp }}/public-evidence/${{ matrix.target }}/"
      - uses: actions/download-artifact@v8.0.2
        if: matrix.target != 'windows-x64'
        with:
          name: npm-public-registry
          path: ${{ runner.temp }}
          digest-mismatch: error
      - name: Verify normal public npm installation and npx execution
        if: matrix.target != 'windows-x64'
        run: uv run --no-project --python 3.12.14 python .github/workflows/build_npm.py probe --input "${{ runner.temp }}/release-npm" --target "${{ matrix.target }}" --mode public --smoke --public-evidence "${{ runner.temp }}/npm-public-registry.json" --output "${{ runner.temp }}/public-evidence/${{ matrix.target }}/npm-public.json"
      - name: Preserve public download and consumer evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-public-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/public-evidence/${{ matrix.target }}/verification.json
            ${{ runner.temp }}/public-evidence/${{ matrix.target }}/*.download.json
            ${{ runner.temp }}/public-evidence/${{ matrix.target }}/npm-public.json
          if-no-files-found: warn

  release-complete:
    if: "!cancelled() && github.event_name == 'push' && needs.public-consumer.result == 'success' && needs.pypi-consumer.result == 'success' && needs.distribution-admit.result == 'success'"
    needs: [public-consumer, pypi-consumer, distribution-admit]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BREWDOC_RELEASE_TAG: ${{ needs.distribution-admit.outputs.tag }}
      BREWDOC_SOURCE_SHA: ${{ needs.distribution-admit.outputs.source_sha }}
      BREWDOC_PACKAGE_CHECKOUT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12.14"
          cache-suffix: ${{ runner.os }}-${{ runner.arch }}-uv0.12.21-py3.12.14-${{ hashFiles('uv.lock') }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-public-linux-x64
          path: ${{ runner.temp }}/public-evidence/linux-x64
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-public-macos-arm64
          path: ${{ runner.temp }}/public-evidence/macos-arm64
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-public-windows-x64
          path: ${{ runner.temp }}/public-evidence/windows-x64
          digest-mismatch: error
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-public-registry
          path: ${{ runner.temp }}/public-evidence
          digest-mismatch: error
      - name: Admit public channels before generating final installation instructions
        run: |
          uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py admit-public --input "${{ runner.temp }}/release-assets" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA" --evidence "${{ runner.temp }}/public-evidence" --output "${{ runner.temp }}/public-acceptance.json"
          uv run --no-project --python 3.12.14 python .github/workflows/release_guide.py render --checkout "$BREWDOC_PACKAGE_CHECKOUT" --phase public --native-manifest "${{ runner.temp }}/release-assets/binaries.json" --npm-manifest "${{ runner.temp }}/release-assets/npm-manifest.json" --availability "${{ runner.temp }}/public-acceptance.json" --output "${{ runner.temp }}/public-body.md"
      - name: Finalize normal tag-release instructions after public admission
        run: uv run --no-project --python 3.12.14 python .github/workflows/release_assets.py finalize --input "${{ runner.temp }}/release-assets" --tag "$BREWDOC_RELEASE_TAG" --source-sha "$BREWDOC_SOURCE_SHA" --evidence "${{ runner.temp }}/public-evidence" --body "${{ runner.temp }}/public-body.md"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-public-acceptance
          path: |
            ${{ runner.temp }}/public-acceptance.json
            ${{ runner.temp }}/public-body.md
          if-no-files-found: error

  recovery-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'prepare-v020'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Verify original artifacts and independent installations
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py prepare
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: recovery-v020
          path: recovery-v020/
          if-no-files-found: error

  recovery-admit:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Admit approved preparation and public file state
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py admit

  recovery-publish:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    needs: recovery-admit
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Recheck approvals and stage only missing PyPI files
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py preflight
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        if: steps.preflight.outputs.upload_needed == 'true'
        with:
          packages-dir: recovery-upload/

  recovery-github:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-v020'
    needs: recovery-publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: dc1f0c7fdedeec024840127ed989e1f58416762a
          path: package-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.12"
      - name: Verify PyPI and complete original GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 python control/.github/workflows/recover_v020.py github
