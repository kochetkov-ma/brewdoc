[project]
name = "brewdoc"
version = "0.1.0"
description = "Brew any document into LLM-ready Markdown: PDF tables, spreadsheets, docx - no ML, deterministic, with a JSON receipt"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maksim Kochetkov", email = "apmatypa88@gmail.com" }]
requires-python = ">=3.10"
keywords = ["pdf", "docx", "xlsx", "markdown", "llm", "table-extraction", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pdfplumber==0.11.10",
    "python-calamine==0.8.2",
]

[project.urls]
Homepage = "https://github.com/kochetkov-ma/brewdoc"
Repository = "https://github.com/kochetkov-ma/brewdoc"
Issues = "https://github.com/kochetkov-ma/brewdoc/issues"

[project.scripts]
brewdoc = "brewdoc.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brewdoc"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
